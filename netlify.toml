[build]
  base    = "frontend"
  publish = "."
  command = "echo 'Static site — no build step needed'"

[build.environment]
  NODE_VERSION = "18"

# ─────────────────────────────────────────────────────────────
#  SECURITY HEADERS
# ─────────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    # Evita clickjacking (cargar la web en un iframe de otro sitio)
    X-Frame-Options = "DENY"

    # Evita MIME sniffing
    X-Content-Type-Options = "nosniff"

    # Controla el header Referer
    Referrer-Policy = "strict-origin-when-cross-origin"

    # Desactiva features del navegador que no se usan
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

    # XSS Protection (navegadores legados)
    X-XSS-Protection = "1; mode=block"

    # HSTS — fuerza HTTPS por 1 año
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

    # Content Security Policy
    # 'unsafe-inline' en script-src y style-src es necesario porque:
    #   - admin.html y mis-citas.html tienen <script> inline (no archivo externo)
    #   - Todos los archivos usan style="..." inline en el HTML y JS generado
    # Sin 'unsafe-inline' el CSS y JS dejan de funcionar (página en blanco/rota)
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://happybody-production-b0bf.up.railway.app; frame-ancestors 'none'; base-uri 'self'; form-action 'self';"

# ─────────────────────────────────────────────────────────────
#  REDIRECTS
# ─────────────────────────────────────────────────────────────
# Páginas HTML directas — no redirigir al index
[[redirects]]
  from   = "/admin.html"
  to     = "/admin.html"
  status = 200

[[redirects]]
  from   = "/mis-citas.html"
  to     = "/mis-citas.html"
  status = 200

# Todo lo demás → SPA index.html
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200